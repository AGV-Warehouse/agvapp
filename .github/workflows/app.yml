name: app-contract
on: [push, pull_request]
jobs:
  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --test tests/*.test.cjs
      - run: |
          node --check app.js
          node --check fleet-api.js
          node --check portal-state.js
          node --check command-receipts.js
          node --check map-release-ui.js
          node --check simulation-run-ui.js
          node --check editor.js
          node --check sw.js
      - run: python3 -m unittest discover -s tests -p test_preview_p0.py -q
